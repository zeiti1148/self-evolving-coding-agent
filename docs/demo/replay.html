nywhere;margin-bottom:12px}.codebar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;background:#213c4e;color:#e5eef2;font-size:12px;border-radius:9px 9px 0 0}.codebar .legend{display:flex;gap:14px}.code-wrap{background:var(--code);color:#e4eef4;overflow:auto;max-height:500px;border-radius:0 0 9px 9px}.code{font:var(--code-size)/1.7 Consolas,"Cascadia Code",monospace;margin:0;padding:16px;white-space:pre;tab-size:4}.diff{width:100%;border-collapse:collapse;font:var(--code-size)/1.7 Consolas,monospace;white-space:pre}.diff td{padding:0 8px}.diff .ln{color:#98b1c1;width:45px;text-align:right;user-select:none;border-right:1px solid #355061}.diff .sign{width:25px;text-align:center;user-select:none}.diff .added{background:#164f42}.diff .removed{background:#602e3b}.diff .same{color:#c1d1dc}.diff td:last-child{min-width:600px;padding-right:20px}.file-jumps{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.file-jumps button{font:12px Consolas,monospace;padding:7px 10px}.smallnote{color:var(--muted);font-size:12px;line-height:1.7;margin-top:12px}.notice{background:#eff7f5;color:#236755;padding:12px 15px;border:1px solid #c4e3d9;border-radius:9px;font-size:13px;line-height:1.7;margin-bottom:16px}.notice.warning{background:#fff3e8;border-color:#efcfad;color:#8a551d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.stat{padding:15px;background:#f3f7f8;border:1px solid var(--line);border-radius:11px}.stat strong{display:block;font:700 34px Consolas,monospace}.stat span{font-size:12px;color:var(--muted)}.stat.bad strong{color:var(--red)}.stat.good strong{color:var(--green)}.section-title{margin-top:22px;margin-bottom:12px}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.module{background:#f2f7f8;border:1px solid var(--line);border-radius:9px;padding:16px 12px;overflow-wrap:anywhere}.module strong{display:block;font:14px Consolas,monospace;color:var(--teal)}.module span{font-size:12px;color:var(--muted)}.flow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.flow span{border:1px solid var(--line);background:#f5f8fa;padding:8px 12px;border-radius:6px;font-size:13px}.flow span:not(:last-child)::after{content:' →';margin-left:8px;color:var(--teal)}details{margin-top:18px;border:1px solid var(--line);border-radius:9px;padding:12px 15px}summary{cursor:pointer;font-size:13px;color:var(--muted)}details pre{overflow:auto;max-height:350px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace}.result-banner{padding:19px;border-radius:12px;background:#e6f5ee;border:1px solid #bddfd0;color:#1a6349;margin-bottom:18px}.result-banner.failed{color:#96333f;border-color:#e9bdc5;background:#fff0f2}.result-banner h3{font-size:23px;margin-bottom:8px}.result-banner p{font-size:13px;line-height:1.7}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.summary-card{border:1px solid var(--line);border-radius:10px;padding:18px;line-height:1.8;font-size:13px}.summary-card h3{margin-bottom:10px}.summary-card ul{padding-left:18px;margin:0}.experience-field{margin-top:12px}.experience-field strong{color:var(--teal);display:block;font-size:12px}.experience-field p{white-space:pre-wrap;overflow-wrap:anywhere}.footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px;color:var(--muted);font-size:11px;line-height:1.8}.shortcut{white-space:nowrap}.ghost{font-size:12px;padding:7px 10px}.result-time{font-size:12px;color:var(--muted);margin:12px 0}.case-description{white-space:pre-wrap;line-height:1.8;color:var(--muted);font-size:13px}.live-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#5ed9c2;margin-right:7px}

</style></head><body>
<header class="topbar"><div class="brand"><span class="brand-icon">&lt;/&gt;</span><div><h1>Agent 修复放映室</h1><p>从失败的测试，看到真正写回的代码</p></div></div><span class="badge"><i class="live-dot"></i>真实运行录制 · 离线交互回放</span></header>
<div class="shell"><nav class="case-tabs" id="cases" aria-label="选择演示案例"></nav><div class="intro"><div class="learning" id="learning"></div><p id="recording-info"></p></div>
<div class="layout"><aside class="panel timeline-panel"><div class="timeline-heading"><h3>实际执行顺序</h3><p>点击任一步骤，查看当时的代码与证据</p></div><ol class="timeline" id="timeline"></ol></aside>
<main class="panel"><div class="viewer-head"><div class="eyebrow"><span id="step-label"></span><span id="tool-outcome"></span></div><h2 id="stage-title"></h2><p id="stage-summary" class="stage-summary"></p><div class="rail" id="rail"></div></div>
<div class="controls"><button id="play" class="primary" type="button">▶ 播放</button><button id="previous" type="button" aria-label="上一步">←</button><button id="next" type="button" aria-label="下一步">→</button><input id="seek" type="range" min="0" value="0" aria-label="回放进度"><span id="progress" class="progress-count"></span><label for="speed">每步</label><select id="speed"><option value="4000">4 秒</option><option value="8000">8 秒</option><option value="1500">1.5 秒</option></select><button id="restart" class="ghost" type="button">从头</button><button id="zoom" class="ghost" type="button">大字代码</button></div>
<div id="content" class="content" aria-live="polite"></div></main></div>
<footer class="footer"><span>只重放已记录的工具调用，不会联网、调用模型或修改源文件。播放间隔与真实执行耗时无关。</span><span class="shortcut">键盘：← / → 切换，空格播放或暂停</span></footer></div>
<script>
/*__REPLAY_MODEL__*/
const recording = /*__REPLAY_DATA__*/;
let caseIndex=0,cursor=0,timer=null,largeCode=false;
const $=id=>document.getElementById(id);
const current=()=>recording.cases[caseIndex];
function el(tag,cls='',value=''){const node=document.createElement(tag);if(cls)node.className=cls;node.textContent=value;return node}
function stop(){if(timer)clearInterval(timer);timer=null;$('play').textContent='▶ 播放'}
function seek(value){cursor=Math.max(0,Math.min(current().steps.length+1,Number(value)));if(cursor===current().steps.length+1)stop();render()}
function play(){if(timer){stop();return}if(cursor>=current().steps.length+1)cursor=0;timer=setInterval(()=>seek(cursor+1),Number($('speed').value));$('play').textContent='Ⅱ 暂停';render()}
function moveTo(value){stop();seek(value)}
function shortFile(value){return pathKey(value).split('/').pop()||''}
function jumpButtons(parent){const box=el('div','file-jumps');const seen=new Set();current().steps.forEach((step,i)=>{if(step.call.name!=='write_file')return;const path=pathKey(step.call.arguments.path);if(seen.has(path))return;seen.add(path);const b=el('button','',shortFile(path));b.type='button';b.title='跳至此文件首次实际修改';b.onclick=()=>moveTo(i+1);box.append(b)});parent.append(box)}
function codeBlock(parent,text,title='工具输出'){const bar=el('div','codebar',title);const wrap=el('div','code-wrap');wrap.append(el('pre','code',text||'（无文本输出）'));parent.append(bar,wrap)}
function notice(parent,text,warning=false){parent.append(el('div','notice'+(warning?' warning':''),text))}
function statistics(parent,result){const meta=result?.metadata||{};const grid=el('div','stats');for(const [key,label] of [['tests','测试总数'],['failures','断言失败'],['errors','运行错误'],['skipped','跳过']]){const card=el('div','stat'+((key==='failures'||key==='errors'||key==='skipped')&&meta[key]>0?' bad':key==='tests'?' good':''));card.append(el('strong','',Number.isInteger(meta[key])?String(meta[key]):'—'),el('span','',label));grid.append(card)}parent.append(grid)}
function rawRecord(parent,step){const detail=el('details');detail.append(el('summary','','查看原始调用参数与返回元数据'),el('pre','',JSON.stringify({call:step.call,result:{success:step.result.success,error_code:step.result.error_code,metadata:step.result.metadata}},null,2)));parent.append(detail)}
function renderDiff(parent,index){const comparison=writeComparison(current(),index);parent.append(el('p','file-path',comparison.path));notice(parent,comparison.applied?'本次 write_file 已成功。绿色为新增，红色为删除；对比基于这一次写入之前的工作副本。':'本次写入失败。下方仅是提出的修改，不会推进回放中的文件状态。',!comparison.applied);const rows=comparison.before===null?null:diffLines(comparison.before,comparison.after);if(!rows){if(comparison.before===null)notice(parent,'缺少写入前完整内容，只展示本次写入内容。',true);else codeBlock(parent,comparison.before,'修改前');codeBlock(parent,comparison.after,'本次写入');return}const bar=el('div','codebar');bar.append(el('span','','修改前行号 / 修改后行号'),el('span','legend','− 删除    + 新增'));parent.append(bar);const wrap=el('div','code-wrap');const table=el('table','diff');table.setAttribute('aria-label','本次写入前后的逐行差异');const body=el('tbody');for(const row of rows){const tr=el('tr',row.kind);tr.append(el('td','ln',row.oldLine??''),el('td','ln',row.newLine??''),el('td','sign',row.kind==='added'?'+':row.kind==='removed'?'−':' '),el('td','',row.text||' '));body.append(tr)}table.append(body);wrap.append(table);parent.append(wrap);jumpButtons(parent)}

// Human-readable interpretation of named acceptance tests, anchored to recorded failures.
function businessExample(parent, finished=false) {
  const c=current();
  const isOrder=c.id==='java-order-checkout';
  const method=isOrder?'quantityDiscountAndShippingWorkTogether':'fullTargetMustNotConsumeSourceStock';
  const assertion=isOrder?'expected: <4650> but was: <2100>':'expected: <10> but was: <7>';
  if(!['java-order-checkout','java-stock-transfer'].includes(c.id)||!c.baseline.output.includes(method)||!c.baseline.output.includes(assertion))return;
  const box=el('section','business-example');
  box.append(el('h3','',isOrder?'具体看一笔订单':'具体看一次失败的转库'));
  box.append(el('p','',isOrder?'单价 15 元 × 3 件，优惠 10%，折后不足 100 元收运费 6 元。':'源仓有 10 件，目标仓有 4 件、容量为 5；现在请求转移 3 件。'));
  const flow=el('div','business-flow');
  const values=isOrder?['15 × 3 = 45 元','优惠 4.5 元','40.5 + 6 = 46.5 元']:['目标余量只有 1 件','3 件无法存入，应拒绝','两边库存都应不变'];
  for(const text of values)flow.append(el('span','',text));
  box.append(flow);
  const columns=el('div','summary-grid');
  const before=el('div','business-before');
  before.append(el('strong','','真实修复前'),el('p','',isOrder?'返回 21 元（2100 分）':'请求虽被拒绝，源仓却从 10 件变成 7 件'),el('small','',isOrder?'忽略数量，且百分比发生整数截断。':'先扣源仓，再检查目标容量，失败留下了副作用。'));
  const after=el('div','business-after');
  after.append(el('strong','',finished&&c.verified?'独立终验已通过该用例':'验收测试要求'),el('p','',isOrder?'返回 46.5 元（4650 分）':'拒绝转移，源仓 10 件，目标仓 4 件'),el('small','',isOrder?'数量、折扣和运费需要一起正确计算。':'先完成全部条件校验，再改变两边库存。'));
  columns.append(before,after);box.append(columns,el('p','smallnote',`图解依据：${method}。金额与库存来自此用例及原始 Maven 断言；流程图是讲解，不是额外运行。`));
  parent.append(box);
}

function summary(parent){const c=current(),result=c.status.result,verified=c.verified;const banner=el('div','result-banner'+(verified?'':' failed'));banner.append(el('h3','',verified?'本次修复通过独立终验':'本次录制未通过完整验收'),el('p','',`任务状态：${c.status.status}。${c.original_unchanged&&c.tests_unchanged?'原始项目与验收测试保持不变。':'原始项目或测试完整性未确认。'} 此结果仅说明本次案例，不代表普遍修复能力。`));parent.append(banner);businessExample(parent,true);statistics(parent,finalTest(c)?.result);const grid=el('div','summary-grid');const changes=el('div','summary-card');changes.append(el('h3','','实际修改的文件'));const ul=el('ul');for(const path of result?.changed_files||[])ul.append(el('li','',shortFile(path)));changes.append(ul);jumpButtons(changes);const audit=el('div','summary-card');audit.append(el('h3','','运行事实'));const elapsed=c.metrics.elapsed_ms;audit.append(el('p','',`模型：${recording.model}`),el('p','',`实际耗时：${typeof elapsed==='number'?(elapsed/1000).toFixed(1)+' 秒':'未记录'}`),el('p','',`决策轮数：${c.metrics.decision_rounds??'未记录'} · 工具调用：${c.steps.length}`),el('p','',`模型请求：${c.request_counts.success} / ${c.request_counts.total} 成功（含经验提取）`),el('p','',`任务 ID：${c.task_id}`));grid.append(changes,audit);parent.append(grid);parent.append(el('h3','section-title','成功经验是否留下来了？'));if(c.experience){notice(parent,'经验已持久化。当前演示任务关闭检索，展示的是修复后的经验保存，不作为经验效果对照。');for(const [key,label]of [['root_cause','问题根因'],['solution','修复方案'],['verification','验证依据']]){const field=el('div','experience-field');field.append(el('strong','',label),el('p','',c.experience[key]));parent.append(field)}}else notice(parent,result?.experience_save_error||'没有保存成功经验。',true)}
function renderContent(f){const host=$('content');host.replaceChildren();const c=current();if(f.kind==='summary'){summary(host);return}if(f.kind==='baseline'){notice(host,'这是演示准备时在独立副本中运行的基线测试，不冒充 Agent 调用。下面的失败来自原始缺陷。',true);const flow=el('div','flow');for(const value of c.flow)flow.append(el('span','',value));host.append(flow);businessExample(host);statistics(host,f.result);const grid=el('div','module-grid');for(const path of Object.keys(c.initial_files).filter(p=>p.startsWith('src/main/'))){const m=el('div','module');m.append(el('strong','',shortFile(path)),el('span','','业务源文件 · 后续可查看实际修改'));grid.append(m)}host.append(grid);const d=el('details');d.append(el('summary','','查看基线 Maven 输出'),el('pre','',f.result.output));host.append(d);const task=el('details');task.append(el('summary','','查看提交给模型的完整任务要求'),el('p','case-description',c.task_description));host.append(task);return}const step=f.step;if(f.kind==='write_file'){renderDiff(host,cursor-1)}else if(f.kind==='run_tests'){const final=step.result.metadata.final_verification===true;notice(host,final?'程序在模型结束后独立执行这次测试，作为最终验证证据。':'这是模型主动调用的中间测试。之后若继续改代码，仍必须重新验证。',!step.result.success);statistics(host,step.result);codeBlock(host,step.result.output,`${final?'独立最终测试':'模型测试'} · ${step.result.success?'工具成功':step.result.error_code||'工具未成功'}`)}else if(f.kind==='read_file'){host.append(el('p','file-path',String(step.call.arguments.path||'')));notice(host,String(step.call.arguments.path||'').includes('/test/')?'Agent 正在读取不可修改的验收测试，从中了解预期行为。':'Agent 正在读取项目中的真实代码。这里只展示可观察到的调用，不展示或推测模型隐藏思考。');codeBlock(host,step.result.output,'read_file 返回内容')}else if(f.kind==='list_files'){const flow=el('div','flow');for(const value of c.flow)flow.append(el('span','',value));host.append(flow);codeBlock(host,step.result.output,'list_files 返回的项目结构')}else{codeBlock(host,step.result.output,step.call.name)}if(step.result.metadata.truncated)notice(host,'该工具输出已截断，不能据此声称显示了完整内容。',true);if(step.result.error_message)notice(host,`${step.result.error_code}：${step.result.error_message}`,true);rawRecord(host,step)}
function render(){const c=current(),f=frame(c,cursor),total=c.steps.length+1;$('stage-title').textContent=f.title;$('step-label').textContent=cursor===0?'00 / 准备阶段':cursor===total?'完成 / 结果核查':`工具步骤 ${cursor} / ${c.steps.length}`;$('tool-outcome').textContent=f.step?(f.step.result.success?'已完成':'未成功'):'可追溯的真实记录';$('tool-outcome').style.color=f.step&&!f.step.result.success?'var(--red)':'';const descriptions={baseline:'先确认原始项目确实失败，再观察 Agent 如何改变它。',summary:'把最终测试、实际修改和经验记录放在一起核对。',write_file:'这一步最直接地回答：Agent 到底改了哪里？',read_file:'先理解代码和测试约束，再生成修改。',run_tests:'区分中间验证与程序独立终验，保留失败证据。',list_files:'这是跨多个业务文件的修复，不是替换一行默认值。'};$('stage-summary').textContent=descriptions[f.kind]||'查看这次工具调用的输入与真实返回结果。';$('seek').max=total;$('seek').value=cursor;$('progress').textContent=`${cursor}/${total}`;$('previous').disabled=cursor===0;$('next').disabled=cursor===total;$('play').textContent=timer?'Ⅱ 暂停':'▶ 播放';const rail=$('rail');rail.replaceChildren();['观察代码','写入修改','运行测试','最终验收'].forEach((value,index)=>{const active=f.kind==='summary'||f.step?.result.metadata.final_verification?3:f.kind==='write_file'?1:f.kind==='run_tests'?2:0;rail.append(el('span',index===active?'current':'',value))});const list=$('timeline');const timelineScroll=list.scrollTop;list.replaceChildren();for(let i=0;i<=total;i++){const item=frame(c,i);const li=el('li');const b=el('button',i===cursor?'active':'');b.type='button';b.setAttribute('aria-current',i===cursor?'step':'false');const number=el('span','seq',i===0?'○':i===total?'◎':String(i));const desc=el('span');const short=item.kind==='baseline'?'原始失败基线':item.kind==='summary'?'最终结果与经验':item.step.result.metadata.final_verification?'程序独立终验':{list_files:'查看项目',read_file:'读取文件',write_file:'写入修改',run_tests:'运行测试',run_command:'受控命令'}[item.kind]||item.kind;desc.append(el('strong',item.step&&!item.step.result.success?'fail':'',short));desc.append(el('small','',item.step?shortFile(item.step.call.arguments.path)||`${item.step.result.success?'工具成功':'工具未成功'}`:i===0?'独立副本 · 非 Agent 步骤':'查看真实验收状态'));b.append(number,desc);b.onclick=()=>moveTo(i);li.append(b);list.append(li)}list.scrollTop=timelineScroll;const active=list.querySelector('.active');if(active){const top=active.getBoundingClientRect().top-list.getBoundingClientRect().top+list.scrollTop;if(top<list.scrollTop||top+active.offsetHeight>list.scrollTop+list.clientHeight)list.scrollTop=Math.max(0,top-30);}renderContent(f)}
function choose(index){stop();caseIndex=index;cursor=0;$('cases').replaceChildren();recording.cases.forEach((c,i)=>{const b=el('button','case-tab'+(i===index?' active':''));b.type='button';b.setAttribute('aria-pressed',String(i===index));const text=el('span');text.append(el('strong','',c.title),el('small','',c.difficulty));b.append(el('span','number',String(i+1).padStart(2,'0')),text);b.onclick=()=>choose(i);$('cases').append(b)});$('learning').replaceChildren(...current().learning_points.map(x=>el('span','',x)));$('recording-info').textContent=`${recording.model} · ${new Date(recording.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})} 录制`;render()}
$('play').onclick=play;$('previous').onclick=()=>moveTo(cursor-1);$('next').onclick=()=>moveTo(cursor+1);$('seek').oninput=e=>moveTo(e.target.value);$('restart').onclick=()=>moveTo(0);$('speed').onchange=()=>{if(timer){stop();play()}};$('zoom').onclick=()=>{largeCode=!largeCode;document.documentElement.style.setProperty('--code-size',largeCode?'21px':'17px');$('zoom').textContent=largeCode?'标准字号':'大字代码'};
document.addEventListener('keydown',event=>{if(event.target.closest('input,select,textarea,button,summary'))return;if(event.code==='Space'){event.preventDefault();play()}else if(event.key==='ArrowRight'){event.preventDefault();moveTo(cursor+1)}else if(event.key==='ArrowLeft'){event.preventDefault();moveTo(cursor-1)}});
choose(0);
</script></body></html>
