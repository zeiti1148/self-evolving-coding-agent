<body>
<header class="topbar"><h1>经验驱动的 Coding Agent</h1><span>真实运行 · 可交互回放</span></header>
<div class="shell">
<nav id="cases" class="case-tabs" aria-label="选择案例"></nav>
<div class="modebar"><div><button id="play" class="primary">▶ 播放演示</button><p id="recording-info"></p></div><button id="mode" type="button">查看完整执行记录</button></div>
<section id="story-view">
<nav id="story-nav" class="story-nav" aria-label="演示章节"></nav>
<main id="story-content" class="stage" aria-live="polite"></main>
</section>
<section id="log-view" hidden><div class="log-layout"><ol id="timeline" class="timeline"></ol><main id="log-content" class="log-content" aria-live="polite"></main></div></section>
<div class="controls"><button id="previous" aria-label="上一步">←</button><button id="next" aria-label="下一步">→</button><input id="seek" type="range" min="0" value="0" aria-label="演示进度"><span id="progress" class="count"></span><label for="speed">每幕</label><select id="speed"><option value="8000">8 秒</option><option value="4000">4 秒</option><option value="1500">1.5 秒</option></select><button id="restart">从头</button><button id="zoom">大字代码</button></div>
<footer class="footer"><span id="footer-flow">故障 → 定位 → 改代码 → 测试通过 → 保存经验</span><span>← / → 切换 · 空格播放 / 暂停</span></footer>
</div>
<script>
/*__REPLAY_MODEL__*/
const recording = /*__REPLAY_DATA__*/;
const $ = id => document.getElementById(id);
let reuseMode = Boolean(recording.reuse);
const current = () => reuseMode ? recording.reuse.target : recording.cases[caseIndex];
const shortFile = value => pathKey(value).split('/').pop();
let caseIndex = Math.max(0, recording.cases.findIndex(c => c.id === 'java-stock-transfer'));
let scene = 0, logCursor = 0, mode = 'story', timer = null, activeFile = '', large = false;
const sceneLabels = ['故障', '定位', '改代码', '测试通过', '保存经验'];
const stock = () => current().id === 'java-stock-transfer';
function el(tag, cls = '', text = '') {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  n.textContent = text;
  return n;
}
function supportsStory(c) {
  const name = c.id === 'java-stock-transfer' ? 'fullTargetMustNotConsumeSourceStock' : c.id === 'java-order-checkout' ? 'quantityDiscountAndShippingWorkTogether' : '';
  const assertion = c.id === 'java-stock-transfer' ? 'expected: <10> but was: <7>' : 'expected: <4650> but was: <2100>';
  const reads = new Set(c.steps.filter(s=>s.call.name==='read_file'&&s.result.success).map(s=>shortFile(s.call.arguments.path)));
  const required = c.id==='java-stock-transfer' ? ['TransferRequest.java','StockLedger.java','TransferService.java','TransferTest.java'] : ['CartLine.java','DiscountPolicy.java','CheckoutService.java','CheckoutTest.java'];
  const edits = repairEdits(c);
  const service = edits.find(e=>shortFile(e.path)==='TransferService.java')?.after || '';
  const matchesRepair = c.id==='java-stock-transfer' ? service.indexOf('target.total()')>=0 && service.indexOf('target.total()')<service.indexOf('source.withdraw') : edits.some(e=>e.after.includes('return subtotalCents * percent / 100;'));
  return !!name && c.verified && edits.length===3 && required.every(f=>reads.has(f)) && matchesRepair && c.baseline.output.includes(name) && c.baseline.output.includes(assertion);
}
function stop() { if (timer) clearInterval(timer); timer = null; $('play').textContent = '▶ 播放演示'; }
function maxPosition() { return mode === 'story' ? 4 : current().steps.length + 1; }
function position() { return mode === 'story' ? scene : logCursor; }
function seek(value, manual = true) {
  if (manual) stop();
  const target = Math.max(0, Math.min(maxPosition(), Number(value)));
  if (mode === 'story') scene = target; else logCursor = target;
  if (target === maxPosition()) stop();
  render();
}
function play() {
  if (timer) { stop(); return; }
  if (position() === maxPosition()) { if (mode === 'story') scene = 0; else logCursor = 0; }
  timer = setInterval(() => seek(position() + 1, false), Number($('speed').value));
  render();
}

function pickedLines(text, filename, after) {
  const lines = text.replaceAll('\r\n', '\n').split('\n');
  const take = new Set();
  const matching = pattern => lines.forEach((line, i) => { if (pattern.test(line)) take.add(i); });
  if (filename === 'TransferService.java') {
    matching(/source\.withdraw|target\.deposit/);
    if (after) {
      const at = lines.findIndex(line => line.includes('target.total()'));
      if (at >= 0) for (let i = at; i <= Math.min(lines.length - 1, at + 2); i++) take.add(i);
    }
  } else if (filename === 'TransferRequest.java') matching(/quantity\s*[<>=]/);
  else if (filename === 'StockLedger.java') {
    const start = lines.findIndex(line => line.includes('void withdraw'));
    const end = lines.findIndex((line, i) => i > start && line.includes('void deposit'));
    for (let i = start + 1; i < (end < 0 ? lines.length : end); i++) if (/if\s*\(|int current|stock\.put/.test(lines[i])) take.add(i);
  } else if (filename === 'CartLine.java') matching(/return unitCents/);
  else if (filename === 'DiscountPolicy.java') matching(/return subtotalCents/);
  else if (filename === 'CheckoutService.java') matching(/long shipping|long discountedGoods|long discounted =/);
  if (!take.size) lines.forEach((line, i) => { if (line.trim()) take.add(i); });
  return [...take].sort((a,b) => a-b).map(i => ({line:i+1,text:lines[i].trimStart()}));
}
function snippet(parent, edit, after) {
  const filename = shortFile(edit.path), hint = hints[filename] || ['代码修改', '原始代码', '修复后的代码'];
  const card = el('div', 'code-card');
  card.append(el('div', 'code-title ' + (after ? 'after' : 'before'), after ? 'Agent 修复后' : '修复前'));
  const code = el('div', 'excerpt'), lines = pickedLines(after ? edit.after : edit.before, filename, after);
  let last = 0;
  for (const row of lines) {
    if (last && row.line !== last + 1) code.append(el('div', 'ellipsis', '⋯'));
    const n = el('div', 'code-line mark' + (after ? '' : ' bad'));
    n.append(el('span', 'ln', String(row.line)), el('code', '', row.text)); code.append(n); last = row.line;
  }
  card.append(code, el('p', 'code-explain', hint[after ? 2 : 1])); parent.append(card);
}
