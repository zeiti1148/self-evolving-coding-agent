</section>

<div class="controls"><button id="previous" aria-label="上一步">←</button><button id="next" aria-label="下一步">→</button><input id="seek" type="range" min="0" value="0" aria-label="演示进度"><span id="progress" class="count"></span><label for="speed">每幕</label><select id="speed"><option value="8000">8 秒</option><option value="4000">4 秒</option><option value="1500">1.5 秒</option></select><button id="restart">从头</button><button id="zoom">大字代码</button></div>
<footer class="footer"><span id="footer-flow">故障 → 定位 → 改代码 → 测试通过 → 保存经验</span><span>← / → 切换 · 空格播放 / 暂停</span></footer>
</div>
<script>
// Pure replay logic, also exercised by node --test. No DOM or network access.
function pathKey(value) {
  return typeof value === 'string' ? value.replaceAll('\\', '/').replace(/^(\.\/)+/, '') : ''
}

function fileState(recording, throughStep) {
  const files = { ...recording.initial_files }
  for (const step of recording.steps.slice(0, throughStep)) {
    if (step.call.name === 'write_file' && step.result.success && typeof step.call.arguments.content === 'string') {
      files[pathKey(step.call.arguments.path)] = step.call.arguments.content
    }
  }
  return files
}

function writeComparison(recording, index) {
  const step = recording.steps[index]
  const name = pathKey(step.call.arguments.path)
  const before = fileState(recording, index)[name]
  return { path: name, before: before ?? null, after: String(step.call.arguments.content ?? ''), applied: step.result.success }
}

// Overall repair: original source versus the last successful write to each file.
function repairEdits(recording) {
  const edits = new Map()
  recording.steps.forEach((step, index) => {
    if (step.call.name !== 'write_file' || !step.result.success || typeof step.call.arguments.content !== 'string') return
    const path = pathKey(step.call.arguments.path)
    const previous = edits.get(path)
    edits.set(path, { path, before: recording.initial_files[path] ?? '', after: step.call.arguments.content,
      steps: [...(previous?.steps ?? []), index + 1] })
  })
  return [...edits.values()]
}

function diffLines(before, after) {
  const left = before.replaceAll('\r\n', '\n').split('\n')
  const right = after.replaceAll('\r\n', '\n').split('\n')
  // Avoid quadratic work for imported large files. Display complete text instead.
  if (left.length * right.length > 160000) return null
  const grid = Array.from({ length: left.length + 1 }, () => new Uint32Array(right.length + 1))
  for (let i = left.length - 1; i >= 0; i--) for (let j = right.length - 1; j >= 0; j--) {
    grid[i][j] = left[i] === right[j] ? grid[i + 1][j + 1] + 1 : Math.max(grid[i + 1][j], grid[i][j + 1])
  }
  const rows = []
  let i = 0, j = 0
  while (i < left.length || j < right.length) {
    if (i < left.length && j < right.length && left[i] === right[j]) {

      rows.push({ kind: 'removed', oldLine: ++i, newLine: null, text: left[i - 1] })
    } else {
      rows.push({ kind: 'added', oldLine: null, newLine: ++j, text: right[j - 1] })
    }
  }
  return rows
}

cy percentage/rounding and validation, and CheckoutService discounted-total shipping rules and empty-cart total.", "error_type": "AssertionFailedError", "root_cause": "Production logic and validation defects caused JUnit assertion failures: CartLine subtotal returned unitCents instead of unitCents * quantity and did not throw IllegalArgumentException for quantity \u003c= 0 or unitCents \u003c 0; DiscountPolicy computed subtotalCents * (percent / 100), truncating percent before applying it, and did not reject percent outside 0..100; CheckoutService applied shipping based on the pre-discount subtotal and added 600 cents shipping for an empty cart.", "solution": "Changed application source only. CartLine.subtotalCents now returns unitCents * quantity, and its constructor rejects quantity \u003c= 0 and unitCents \u003c 0 with IllegalArgumentException. DiscountPolicy validates percent in 0..100 and nonnegative subtotal, then returns subtotalCents * percent / 100 using integer division/floor for nonnegative values. CheckoutService sums line subtotals, subtracts the discount, adds 600 cents shipping only when the discounted goods total is below 10000 cents, and returns 0 for an empty cart. Tests and build configuration were not modified.", "verification": "Final Maven verification passed: 12 tests; call_id=8b98da6d-f0a6-47d3-b94f-1865c3fa0e6a.", "tags": ["java", "maven", "junit", "validation", "arithmetic", "rounding", "shipping", "discount", "checkout"], "source_task_id": "dc6b7235-58db-41f8-a669-ca90977e2f76", "id": "d3a26868-b4b6-429a-920d-48c2dc7e70a7", "created_at": "2026-10-25T11:17:50.967783Z"}, "verified": true, "original_unchanged": true, "tests_unchanged": true, "task_id": "dc6b7235-58db-41f8-a669-ca90977e2f76", "metrics": {"decision_rounds": 7, "tool_calls": 13, "elapsed_ms": 44955}, "request_counts": {"total": 8, "success": 8}}, {"id": "java-stock-transfer", "title": "库存转移：校验与失败原子性", "difficulty": "中等 · 3 个业务类 · 12 项测试", "task_description": "Repair the stock transfer project. Inspect the source and unchanged tests, reproduce failures first, and modify application source only. TransferRequest rejects null/blank SKU and nonpositive quantity. StockLedger rejects nonpositive deposit/withdraw amounts, allows withdrawing exactly the available quantity, and enforces capacity. TransferService must validate the request and all source/target constraints before modifying either ledger: any rejected transfer must leave both ledgers unchanged. Transferring to the same ledger is a no-op after request validation. Preserve successful transfer behavior and run all unchanged Maven tests. No concurrency support is required; this is an in-memory single-threaded atomicity exercise. Do not change tests or build configuration.", "expected_test_count": 12, "learning_points": ["请求校验、库存边界、服务协调三层", "目标仓容量不足时两边均不能变化", "恰好转空与同仓转移"], "flow": ["请求合法性", "源仓可用量", "目标仓容量", "一次性提交变化"], "initial_files": {"src/main/java/dev/selfevolving/benchmark/StockLedger.java": "package dev.selfevolving.benchmark;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class StockLedger {\n    private final int capacity;\n    private final Map\u003cString, Integer> stock;\n\n    public StockLedger(int capacity, Map\u003cString, Integer> initial) {\n        this.capacity = capacity;\n        this.stock = new HashMap\u003c>(initial);\n    }\n    public int quantity(String sku) { return stock.getOrDefault(sku, 0); }\n    public int total() { return stock.values().stream().mapToInt(Integer::intValue).sum(); }\n    public int capacity() { return capacity; }\n\n    public void withdraw(String sku, int quantity) {\n        if (quantity(sku) \u003c= quantity) throw new IllegalArgumentException(\"Insufficient stock\");\n        stock.put(sku, quantity(sku) - quantity);\n    }\n    public void deposit(String sku, int quantity) {\n        if (total() + quantity > capacity) throw new IllegalArgumentException(\"Capacity exceeded\");\n        stock.put(sku, quantity(sku) + quantity);\n    }\n}\n", "src/main/java/dev/selfevolving/benchmark/TransferRequest.java": "package dev.selfevolving.benchmark;\n\npublic record TransferRequest(String sku, int quantity) {\n    public void validate() {\n        if (sku == null || sku.isBlank() || quantity \u003c 0) {\n            throw new IllegalArgumentException(\"Invalid transfer request\");\n        }\n    }\n}\n", "src/main/java/dev/selfevolving/benchmark/TransferService.java": "package dev.selfevolving.benchmark;\n\npublic class TransferService {\n    public void transfer(StockLedger source, StockLedger target, TransferRequest request) {\n        source.withdraw(request.sku(), request.quantity());\n        target.deposit(request.sku(), request.quantity());\n    }\n}\n", "src/test/java/dev/selfevolving/benchmark/TransferTest.java": "package dev.selfevolving.benchmark;\n\nimport java.util.Map;\nimport org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.*;\n\nclass TransferTest {\n    private final TransferService service = new TransferService();\n    private StockLedger ledger(int capacity, int books) { return new StockLedger(capacity, Map.of(\"book\", books)); }\n\n    @Test void requestRejectsBlankSku() {\n        assertThrows(IllegalArgumentException.class, () -> new TransferRequest(\"  \", 1).validate());\n        assertThrows(IllegalArgumentException.class, () -> new TransferRequest(null, 1).validate());\n    }\n    @Test void requestRejectsZeroQuantity() {\n        assertThrows(IllegalArgumentException.class, () -> new TransferRequest(\"book\", 0).validate());\n    }\n    @Test void validRequestIsAccepted() { assertDoesNotThrow(() -> new TransferRequest(\"book\", 1).validate()); }\n    @Test void canWithdrawExactlyAvailableQuantity() {\n        StockLedger source = ledger(20, 5); source.withdraw(\"book\", 5); assertEquals(0, source.quantity(\"book\"));\n    }\n    @Test void negativeWithdrawalCannotCreateStock() {\n        StockLedger source = ledger(20, 5);\n        asse cessful gift charges points plus fee to the sender and credits only points to the recipient. All tests and Maven configuration must remain unchanged; run the complete test suite.", "expected_test_count": 12, "task_id": "b471785a-9bb6-4771-a915-486d936dd877", "initial_files": {"src/main/java/dev/selfevolving/benchmark/GiftRequest.java": "package dev.selfevolving.benchmark;\n\npublic record GiftRequest(long points, long fee) {\n    public void validate() {\n        if (points \u003c 0) throw new IllegalArgumentException(\"Invalid points\");\n    }\n    public long totalDebit() { return points; }\n}\n", "src/main/java/dev/selfevolving/benchmark/PointsAccount.java": "package dev.selfevolving.benchmark;\n\npublic class PointsAccount {\n    private long balance;\n    private final boolean acceptsGifts;\n    public PointsAccount(long balance, boolean acceptsGifts) {\n        this.balance = balance;\n        this.acceptsGifts = acceptsGifts;\n    }\n    public long balance() { return balance; }\n    public boolean acceptsGifts() { return acceptsGifts; }\n    public void debit(long amount) {\n        if (balance \u003c= amount) throw new IllegalArgumentException(\"Insufficient points\");\n        balance -= amount;\n    }\n    public void credit(long amount) {\n        if (!acceptsGifts) throw new IllegalArgumentException(\"Recipient disabled gifts\");\n        balance += amount;\n    }\n}\n", "src/main/java/dev/selfevolving/benchmark/PointsGiftService.java": "package dev.selfevolving.benchmark;\n\npublic class PointsGiftService {\n    public void give(PointsAccount sender, PointsAccount recipient, GiftRequest request) {\n        sender.debit(request.totalDebit());\n        recipient.credit(request.points());\n    }\n}\n", "src/test/java/dev/selfevolving/benchmark/PointsGiftTest.java": "package dev.selfevolving.benchmark;\n\nimport org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.*;\n\nclass PointsGiftTest {\n    private final PointsGiftService service = new PointsGiftService();\n    @Test void zeroGiftIsRejected() {\n        assertThrows(IllegalArgumentException.class, () -> new GiftRequest(0, 0).validate());\n    }\n    @Test void negativeGiftIsRejected() {\n        assertThrows(IllegalArgumentException.class, () -> new GiftRequest(-1, 0).validate());\n    }\n    @Test void negativeFeeIsRejected() {\n        assertThrows(IllegalArgumentException.class, () -> new GiftRequest(200, -1).validate());\n    }\n    @Test void totalDebitIncludesFee() {\n        assertEquals(210, new GiftRequest(200, 10).totalDebit());\n    }\n    @Test void debitRejectsNonpositiveAmount() {\n        PointsAccount sender = new PointsAccount(1000, true);\n        assertThrows(IllegalArgumentException.class, () -> sender.debit(0));\n        assertThrows(IllegalArgumentException.class, () -> sender.debit(-10));\n        assertEquals(1000, sender.balance());\n    }\n    @Test void exactBalanceCanBeDebited() {\n        PointsAccount sender = new PointsAccount(210, true);\n        sender.debit(210); assertEquals(0, sender.balance());\n    }\n    @Test void creditRejectsNonpositiveAmount() {\n        PointsAccount recipient = new PointsAccount(100, true);\n        assertThrows(IllegalArgumentException.class, () -> recipient.credit(0));\n        assertThrows(IllegalArgumentException.class, () -> recipient.credit(-10));\n        assertEquals(100, recipient.balance());\n    }\n    @Test void giftChargesFeeOnlyToSender() {\n        PointsAccount sender = new PointsAccount(1000, true), recipient = new PointsAccount(100, true);\n        service.give(sender, recipient, new GiftRequest(200, 10));\n        assertEquals(790, sender.balance()); assertEquals(300, recipient.balance());\n    }\n    @Test void disabledRecipientMustNotConsumeSenderPoints() {\n        PointsAccount sender = new PointsAccount(1000, true), recipient = new PointsAccount(100, false);\n        assertThrows(IllegalArgumentException.class, () -> service.give(sender, recipient, new GiftRequest(200, 0)));\n        assertEquals(1000, sender.balance()); assertEquals(100, recipient.balance());\n    }\n    @Test void balanceMustCoverGiftAndFee() {\n        PointsAccount sender = new PointsAccount(205, true), recipient = new PointsAccount(100, true);\n        assertThrows(IllegalArgumentException.class, () -> service.give(sender, recipient, new GiftRequest(200, 10)));\n        assertEquals(205, sender.balance()); assertEquals(100, recipient.balance());\n    }\n    @Test void selfGiftIsRejectedBeforeChangingBalance() {\n        PointsAccount same = new PointsAccount(1000, true);\n        assertThrows(IllegalArgumentException.class, () -> service.give(same, same, new GiftRequest(200, 10)));\n        assertEquals(1000, same.balance());\n    }\n    @Test void validGiftWithNoFeeAndInvalidRequestAreHandled() {\n        PointsAccount sender = new PointsAccount(1000, true), recipient = new PointsAccount(100, true);\n        service.give(sender, recipient, new GiftRequest(200, 0));\n        assertEquals(800, sender.balance()); assertEquals(300, recipient.balance());\n        assertThrows(IllegalArgumentException.class, () -> service.give(sender, recipient, new GiftRequest(0, 0)));\n        assertEquals(800, sender.balance()); assertEquals(300, recipient.balance());\n    }\n}\n"}, "baseline": {"call_id": "b8242b3a-e57a-4c5f-a653-b7d0fd731b5f", "tool_name": "run_tests", "success": false, "output": "[INFO] Scanning for projects...\n[INFO] \n[INFO] ---------------\u003c dev.selfevolving.benchmark:points-gift >---------------\n[INFO] Building Stock Transfer Benchmark 1.0-SNAPSHOT\n[INFO]   from pom.xml\n[INFO] --------------------------------[ jar ]---------------------------------\n[INFO] \n[INFO] --- clean:3.2.0:clean (default-clean) @ points-gift ---\n[INFO] \n[INFO] --- resources:3.3.1:resources (default-resources) @ points-gift ---\n[INFO] \n[INFO] --- compiler:3.14.1:compile (default-compile) @ points-gift ---\n[INFO] Recompiling the module because of chan function pickedLines(text, filename, after) {

      const at = lines.findIndex(line => line.includes('target.total()'));
      if (at >= 0) for (let i = at; i <= Math.min(lines.length - 1, at + 2); i++) take.add(i);
    }
  } else if (filename === 'TransferRequest.java') matching(/quantity\s*[<>=]/);
  else if (filename === 'StockLedger.java') {
    const start = lines.findIndex(line => line.includes('void withdraw'));
    const end = lines.findIndex((line, i) => i > start && line.includes('void deposit'));
    for (let i = start + 1; i < (end < 0 ? lines.length : end); i++) if (/if\s*\(|int current|stock\.put/.test(lines[i])) take.add(i);
  } else if (filename === 'CartLine.java') matching(/return unitCents/);

  if (!take.size) lines.forEach((line, i) => { if (line.trim()) take.add(i); });

  verification: ['验证依据', '12 项 Maven 测试通过', '由程序根据独立最终测试写入，带测试数量和验证调用 ID。'],
  tags: ['检索标签', 'java · validation · atomicity', '用于筛选技术环境和问题主题。当前 Agent 固定要求 java 标签。'],
  source_task_id: ['来源任务', '关联库存修复任务', '由程序绑定来源任务，能够从经验追到这次修复。'],
  id: ['经验编号', '贯穿存储、检索、模型请求', '保存时生成 UUID。同一编号在检索结果和模型请求中出现，串起完整复用路径。'],
  created_at: ['保存时间', '用于按新旧排序', '保存时生成 UTC 时间；检索按创建时间、ID 降序排列，最多返回 5 条。'],
};

function reuseFieldSchema(host, r) {
  heading(host, '', '一次成功修复，沉淀成 9 个字段', '模型提炼修复知识；程序补齐验证和来源，经 Pydantic 校验后写入 SQLite。');
  const groups = el('div','field-groups');
  const detail = el('div','field-detail');
  const buttons = [];
  function select(key) {
    buttons.forEach(([k,b])=>b.classList.toggle('selected',k===key));
    const actual=['error_type','id','source_task_id'].includes(key)?r.source_experience[key]:key==='tags'?r.source_experience.tags.join(' · '):key==='created_at'?new Date(r.source_experience.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):fieldInfo[key][1];
    detail.replaceChildren(el('strong','',fieldInfo[key][0]+' · '+key),el('p','field-example','本条经验：'+actual),el('p','',fieldInfo[key][2]));
    details(detail,'查看本字段的已保存原文',typeof r.source_experience[key]==='string'?r.source_experience[key]:JSON.stringify(r.source_experience[key],null,2));
  }
  for(const [title,keys] of [['用于查找',['error_type','tags']],['用于复用',['task_summary','root_cause','solution']],['用于追溯',['verification','source_task_id','id','created_at']]]) {
    const group=el('div','field-group'); group.append(el('h3','',title));
    for(const key of keys) {
      const b=el('button','field-button');b.append(el('strong','',fieldInfo[key][0]),el('code','',key));b.onclick=()=>select(key);group.append(b);buttons.push([key,b]);
    } groups.append(group);
  } host.append(groups,detail);select('solution');
  const pipeline=el('div','reuse-pipeline');
  for(const t of ['修复轨迹 + 测试结果','模型提炼 JSON','校验与补齐字段','SQLite'])pipeline.append(el('span','',t));host.append(pipeline);
}

function reuseSearch(host,r) {
  heading(host,'','新任务来了，先从经验库找参考','积分转赠失败后发送方仍被扣分；任务描述包含 IllegalArgumentException。');
  const query=el('div','query-banner');
  query.append(el('strong','','本次实际检索'),el('code','',`tags = ["java"]  ·  error_type = "${r.query.error_type}"  ·  limit = ${r.query.limit}`));host.append(query);
  const cards=el('div','retrieval-cards');const ids=new Set(r.matched_experiences.map(e=>e.id));
  for(const exp of r.experiences_before) {
    const matched=ids.has(exp.id),c=el('div','retrieval-card'+(matched?' matched':''));
    c.append(el('span','match-label',matched?'✓ 命中':'异常类型不同'),el('h3','',exp.id===r.source_experience.id?'库存转移经验':'订单结算经验'),el('code','',exp.error_type),el('p','',exp.id===r.source_experience.id?'先校验全部约束，再修改状态':'数量、折扣与运费的计算规则'),el('small','',`java 标签：${exp.tags.includes('java')?'匹配':'未匹配'} · ID ${exp.id.slice(0,8)}`));cards.append(c);
  }host.append(cards);
  host.append(el('div','callout good',`${r.experiences_before.length} 条已有经验 → 按异常类型和 Java 标签筛选 → 命中 ${r.matched_experiences.length} 条`));
  details(host,'查看检索调用',`search_experiences("", tags=["java"], error_type="${r.query.error_type}", limit=${r.query.limit})\n\n排序：created_at DESC, id DESC\n返回经验 ID：${r.matched_experiences.map(e=>e.id).join(', ')}`);
}

function reuseInjection(host,r) {
  heading(host,'','把经验正文放进模型这一次的上下文','新任务描述和命中的经验一起发送，模型读取根因与方案，再生成工具调用。');
  const grid=el('div','injection-grid');
  const task=el('div','injection-card');task.append(el('span','pill','task'),el('h3','','积分转赠任务'),el('p','','接收方关闭收礼时，应保留发送方积分；成功时发送方承担赠送积分和手续费。'));
  const exp=el('div','injection-card knowledge');exp.append(el('span','pill','reference_experiences[0]'),el('h3','','库存修复经验'),el('p','','根因：状态修改发生在后续校验之前。'),el('p','','方案：先校验全部前置条件，再修改状态。'),el('small','','经验 ID：'+r.source_experience.id.slice(0,8)));
  grid.append(task,el('div','injection-plus','+'),exp,el('div','injection-plus','→'),el('div','model-box','模型决策\n生成工具调用'));host.append(grid);
  const proof=el('div','request-proof');
  proof.append(el('strong','',`成功请求已携带 ${r.request.user_content.reference_experiences.length} 条经验`),el('span','',`HTTP ${r.request.event.http_status} · 经验 ID 与正文 SHA-256 对应一致`));host.append(proof);
  const code=`{"role": "user", "content": json.dumps({
  "task": request.task_description,
  "max_decisions": request.max_steps,
  "reference_experiences": reference_data
}, ensure_ascii=False)}`;
  host.append(el('pre','terminal',code));
  details(host,'展开该次模型请求的真实任务与经验正文',JSON.stringify(r.request.user_content,null,2));
}

function reuseApply(host,r) {
  const t=r.target, edit=repairEdits(t).find(e=>shortFile(e.path)==='PointsGiftService.java');
  heading(host,'','把“先校验、再改状态”用到积分转赠','库存案例检查目标容量；积分案例检查接收权限和发送方余额，另处理手续费。');
  const bridge=el('div','reuse-bridge');bridge.append(el('span','','旧经验：先校验目标约束'),el('b','','→'),el('strong','','新代码：先检查接收方是否允许收礼'));host.append(bridge);
  if(edit) {
    const pair=el('div','code-pair');
    for(const [after,label,source] of [[false,'修复前',edit.before],[true,'模型收到经验后的修复',edit.after]]) {
      const card=el('div','code-card');card.append(el('div','code-title '+(after?'after':'before'),label));const code=el('div','excerpt');
      source.replaceAll('\r\n','\n').split('\n').forEach((line,i)=>{if(/recipient\.acceptsGifts|sender\.debit|recipient\.credit/.test(line)){const row=el('div','code-line mark'+(after?'':' bad'));row.append(el('span','ln',String(i+1)),el('code','',line.trimStart()));code.append(row)}});card.append(code);pair.append(card);
    }host.append(pair);
    const d=el('details');d.append(el('summary','','展开 PointsGiftService 的完整修改'));drawDiff(d,edit.before,edit.after);host.append(d);
  }
  const final=finalTest(t)?.result.metadata;
  host.append(el('div','reuse-result',`发送方：1000 → 1000 分　｜　接收方：100 → 100 分　｜　${final?.tests} 项测试全部通过`));
}

function reuseGrowth(host,r) {
  const before=r.experiences_before.length,after=r.experiences_after.length;
  heading(host,'','新的成功修复，再变成下一条经验','积分转赠经验已保存，后续相似任务可继续检索这些记录。');
  const growth=el('div','growth-row');
  for(const [label,value] of [['开始时的经验库',before],['本次命中',r.matched_experiences.length],['新增成功经验',after-before],['完成后的经验库',after]]){const card=el('div','growth-card');card.append(el('span','',label),el('strong','',String(value)),el('small','','条'));growth.append(card)}host.append(growth);
  const loop=el('div','knowledge-loop');for(const label of ['修复任务','测试验证','提炼经验','存入知识库','检索并注入下一任务'])loop.append(el('span','',label));host.append(loop);
  host.append(el('div','callout good','项目核心：把修复过程沉淀为知识，让知识进入下一次修复。'));
  details(host,'查看这次新增的积分转赠经验',JSON.stringify(r.target.experience,null,2));
}

function renderReuseScene(scene,host) {
  [reuseFieldSchema,reuseSearch,reuseInjection,reuseApply,reuseGrowth][scene](host,recording.reuse);
}

if(recording.reuse)chooseReuse();else choose(caseIndex);
</script>
